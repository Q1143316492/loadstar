<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>cwl-pet</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="stage">
    <div id="bubble" class="hidden">
      <span id="bubble-text"></span>
    </div>

    <section id="chat" class="hidden" aria-label="桌宠对话">
      <header id="chat-head">
        <img id="chat-avatar" class="chat-avatar" src="../assets/unknown.svg" alt="" />
        <span class="chat-name">桌宠</span>
        <span id="chat-status" class="chat-status"></span>
        <button id="chat-collapse" title="收起（Esc）" aria-label="收起对话">
          <svg viewBox="0 0 16 16" width="12" height="12" aria-hidden="true">
            <path d="M6 3l5 5-5 5" fill="none" stroke="currentColor" stroke-width="1.8"
                  stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </button>
      </header>
      <div id="chat-list" class="chat-list">
        <p id="chat-empty" class="chat-empty">说点什么——消息会显示在这里。</p>
      </div>
      <form id="chat-form" class="chat-form">
        <input id="chat-input" class="chat-input" type="text" placeholder="说点什么…"
               autocomplete="off" spellcheck="false" />
        <button class="chat-send" type="submit">发送</button>
      </form>
    </section>

    <div id="pet" data-state="idle">
      <img id="pet-img" src="../assets/unknown.svg" alt="" />
      <button id="chat-open" class="hidden" title="打开对话" aria-label="打开对话">
        <svg viewBox="0 0 16 16" width="13" height="13" aria-hidden="true">
          <path d="M2 2.5h12v8.5H7.2L3 14v-3H2z" fill="currentColor" />
        </svg>
      </button>
    </div>
  </div>
  <script src="renderer.js"></script>
</body>
</html>

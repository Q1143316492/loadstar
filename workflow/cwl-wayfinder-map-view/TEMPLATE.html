<!doctype html>
<!--
  决策地图的壳。

  这个文件由 render.js 灌数据；不要手改壳里的任何一行。
  数据契约与写法约束在 SKILL.md；壳的渲染逻辑在下面 `MAP_DATA_END` 之后。

  下面这段示例数据只是让本文件单独打开时也能渲染，真实数据由 render.js 替换。
-->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>决策地图</title>
<style>
  :root {
    --paper: #f8f6f2;
    --surface: #fffdfa;
    --ink: #1b1a18;
    --ink-2: #46433d;
    --muted: #6f6a61;
    --faint: #a49e93;
    --rule: #e6e1d8;
    --rule-2: #d5cfc3;
    --ready: #0f6b52;
    --ready-bg: #eaf5f1;
    --claimed: #2f4e86;
    --claimed-bg: #eef2fa;
    --blocked: #a39c91;
    --blocked-bg: #f2f0ea;
    --resolved: #0f6b60;
    --resolved-bg: #e9f3f2;
    --wire: #bdb5a6;
    --sans: ui-sans-serif, system-ui, "Segoe UI", "Microsoft YaHei UI", "PingFang SC", sans-serif;
    --serif: ui-serif, Georgia, "Noto Serif SC", "Source Han Serif SC", "Songti SC", serif;
    --mono: ui-monospace, "Cascadia Mono", Consolas, "Courier New", monospace;

    --t-grill-bg: #f1eee6; --t-grill-fg: #5b5343;
    --t-res-bg:   #efeaf5; --t-res-fg:   #5b4670;
    --t-task-bg:  #e7eef2; --t-task-fg:  #3c5c6d;
    --t-proto-bg: #f5ecef; --t-proto-fg: #6b4352;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    font: 14px/1.7 var(--sans); color: var(--ink); background: var(--paper);
    -webkit-font-smoothing: antialiased; font-variant-numeric: tabular-nums;
  }
  h1, h2, h3, p, ul { margin: 0; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; text-align: left; }
  [hidden] { display: none !important; }

  .s-ready    { --st: var(--ready);    --stbg: var(--ready-bg); }
  .s-claimed  { --st: var(--claimed);  --stbg: var(--claimed-bg); }
  .s-blocked  { --st: var(--blocked);  --stbg: var(--blocked-bg); }
  .s-resolved { --st: var(--resolved); --stbg: var(--resolved-bg); }

  .eyebrow { font: 500 9.5px/1 var(--mono); letter-spacing: .18em; text-transform: uppercase; color: var(--faint); }
  .smallcaps { font: 500 9.5px/1 var(--mono); letter-spacing: .16em; text-transform: uppercase; color: var(--faint); }

  .type {
    display: inline-flex; align-items: center;
    font: 600 8.5px/1 var(--mono); letter-spacing: .12em;
    border-radius: 2px; padding: 4px 5px; white-space: nowrap;
  }
  .type.grill { background: var(--t-grill-bg); color: var(--t-grill-fg); }
  .type.res   { background: var(--t-res-bg);   color: var(--t-res-fg); }
  .type.task  { background: var(--t-task-bg);  color: var(--t-task-fg); }
  .type.proto { background: var(--t-proto-bg); color: var(--t-proto-fg); }

  .state { font: 500 8.5px/1 var(--mono); letter-spacing: .1em; color: var(--st); background: var(--stbg); border-radius: 2px; padding: 3px 5px; white-space: nowrap; }
  .dot { width: 5px; height: 5px; border-radius: 50%; background: var(--st); flex: none; display: inline-block; }

  /* ── 页头 ────────────────────────────────── */
  .vA { max-width: 1140px; margin: 0 auto; padding: 72px 40px 180px; }
  .head .eyebrow { margin-bottom: 16px; }
  .head h1 { font: 600 33px/1.28 var(--serif); letter-spacing: -.012em; max-width: 22ch; }
  .head .lede { margin-top: 14px; max-width: 64ch; font: 400 16px/1.85 var(--serif); color: var(--ink-2); }

  .now {
    display: grid; grid-template-columns: 92px 1fr; gap: 0 24px;
    margin-top: 42px; padding: 24px 0 26px;
    border-top: 1px solid var(--ink); border-bottom: 1px solid var(--rule);
  }
  .now-k { padding-top: 8px; }
  .now h2 { font: 600 25px/1.34 var(--serif); letter-spacing: -.01em; }
  .now h2 .id { font-family: var(--mono); font-size: 12.5px; font-weight: 500; letter-spacing: .1em; color: var(--st); margin-right: 11px; vertical-align: 3px; }
  .now h2 .type { margin-right: 10px; vertical-align: 3px; }
  .now p { margin-top: 7px; max-width: 60ch; font-size: 13px; color: var(--muted); }
  .now .alt { margin-top: 12px; font: 500 10.5px/1.7 var(--mono); letter-spacing: .08em; color: var(--faint); }
  .now .alt b { color: var(--claimed); font-weight: 500; }

  /* ── 分波横带 ────────────────────────────── */
  .waves { position: relative; margin-top: 4px; }
  .wave { position: relative; z-index: 1; display: grid; grid-template-columns: 92px 1fr; gap: 0 24px; padding: 30px 0 40px; border-bottom: 1px solid var(--rule); }
  .wave:last-of-type { border-bottom: 0; }
  .wave-n { font: 400 34px/1 var(--serif); color: #dcd5c8; letter-spacing: -.02em; padding-top: 1px; }
  .wave-n small { display: block; margin-top: 9px; font: 500 9px/1.4 var(--mono); letter-spacing: .12em; color: var(--faint); text-transform: uppercase; }
  .wave-head { display: flex; align-items: baseline; justify-content: space-between; gap: 20px; margin-bottom: 16px; }
  .wave-head .t { font: 500 10px/1 var(--mono); letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }
  .wave-head .note { max-width: 46ch; font-size: 11.5px; line-height: 1.6; color: var(--faint); text-align: right; }

  .rail {
    display: grid; align-content: start;
    grid-template-columns: repeat(auto-fill, minmax(202px, 1fr));
    gap: 14px;
  }

  /* ── 节点卡片 ────────────────────────────── */
  .tk {
    position: relative; z-index: 1; display: block; width: 100%;
    background: var(--surface); border: 1px solid var(--rule-2); border-left: 2px solid var(--st);
    border-radius: 5px; padding: 11px 12px 12px;
    transition: border-color .16s, box-shadow .16s, transform .16s, opacity .18s, background .16s;
  }
  .tk:hover { box-shadow: 0 7px 22px rgba(27,26,24,.09); }
  .tk.exp { grid-column: span 2; background: #fffefb; border-color: var(--st); box-shadow: 0 12px 34px rgba(27,26,24,.11); }
  .tk.s-blocked { background: #fbf9f5; }
  .tk.s-blocked.exp { background: #fdfcf9; }
  .tk.s-resolved { background: #fbfcfb; }
  .tk.dim { opacity: .3; }
  .tk.hot { border-left-width: 3px; }

  .tk-top { display: flex; align-items: center; gap: 6px; }
  .tk-id { font: 600 9.5px/1 var(--mono); letter-spacing: .1em; color: var(--st); }
  .tk-right { margin-left: auto; display: inline-flex; align-items: center; gap: 5px; }
  .tk-chev { font: 400 11px/1 var(--mono); color: var(--faint); transition: transform .2s; }
  .tk.exp .tk-chev { transform: rotate(180deg); }

  .tk-nm { display: block; margin-top: 7px; font-size: 13.5px; font-weight: 600; line-height: 1.42; color: var(--ink); }
  .tk.s-blocked .tk-nm { color: var(--ink-2); }
  .tk.s-resolved .tk-nm { color: var(--ink-2); }
  .tk-gist { display: block; margin-top: 4px; font-size: 11.5px; line-height: 1.6; color: var(--muted); }
  .tk-wait { display: block; margin-top: 8px; font: 500 9.5px/1.4 var(--mono); letter-spacing: .06em; color: var(--faint); }

  /* 展开区：0fr → 1fr 的高度动画 */
  .det { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .24s cubic-bezier(.4,0,.2,1); }
  .det > .det-in { overflow: hidden; }
  .tk.exp .det { grid-template-rows: 1fr; }
  .det-in > * { opacity: 0; transition: opacity .18s .06s; }
  .tk.exp .det-in > * { opacity: 1; }

  .det-sec { margin-top: 13px; padding-top: 11px; border-top: 1px solid var(--rule); }
  .det-k { font: 500 9px/1 var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--faint); margin-bottom: 8px; }
  .det-brief { font-size: 12.5px; line-height: 1.7; color: var(--ink-2); }
  .bul { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 3px 16px; margin: 8px 0 0; padding: 0; list-style: none; }
  .bul li { position: relative; padding-left: 11px; font-size: 12px; line-height: 1.62; color: var(--ink-2); }
  .bul li::before { content: "–"; position: absolute; left: 0; color: var(--rule-2); }
  .dep-row { display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: baseline; }
  .dep { display: inline-flex; align-items: baseline; gap: 5px; font-size: 11.5px; color: var(--ink-2); }
  .dep b { font: 600 9.5px var(--mono); letter-spacing: .06em; color: var(--st); }
  .dep-none { font-size: 11.5px; color: var(--ready); }
  .det-file { margin-top: 12px; font: 400 10px/1.5 var(--mono); color: var(--faint); word-break: break-all; }

  /* ── 连线 ────────────────────────────────── */
  .edges { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; z-index: 0; }
  .edges .wire { fill: none; stroke: var(--wire); stroke-width: 1.4; transition: opacity .18s, stroke .18s, stroke-width .18s; }
  .edges .wire.hi { stroke: var(--ready); stroke-width: 2; }
  .edges .node-dot { fill: var(--wire); transition: fill .18s, opacity .18s; }
  .edges .node-dot.hi { fill: var(--ready); }
  .edges.focus .wire:not(.hi) { opacity: .12; }
  .edges.focus .node-dot:not(.hi) { opacity: .12; }

  .legend { display: flex; flex-wrap: wrap; gap: 20px 24px; margin-top: 26px; font-size: 10.5px; color: var(--faint); }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .legend svg { width: 26px; height: 12px; }
  .legend .type { font-size: 8.5px; }

  /* ── 角标 ────────────────────────────────── */
  .tagbar {
    position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); z-index: 80;
    display: flex; align-items: center; gap: 9px; padding: 6px 9px;
    background: #1b1a18; color: #f5f2ec; border-radius: 3px;
    box-shadow: 0 12px 34px rgba(27,26,24,.34);
  }
  .tagbar .k { font: 500 8.5px/1 var(--mono); letter-spacing: .16em; text-transform: uppercase; color: #c9b98a; border: 1px solid rgba(201,185,138,.45); border-radius: 2px; padding: 4px 5px; }
  .tagbar .h { font: 400 10.5px/1 var(--mono); letter-spacing: .06em; color: #8d8880; }

  @media (max-width: 1000px) {
    .rail { grid-template-columns: repeat(auto-fill, minmax(176px, 1fr)); }
  }
  @media (max-width: 760px) {
    .vA { padding: 44px 16px 160px; }
    .head h1 { font-size: 25px; }
    .now, .wave { grid-template-columns: 40px 1fr; gap: 0 14px; }
    .wave-n { font-size: 22px; }
    .wave-head { flex-direction: column; gap: 4px; }
    .wave-head .note { text-align: left; }
    .rail { grid-template-columns: 1fr; }
    .tk.exp { grid-column: span 1; }
    .edges { display: none; }
  }
</style>
</head>
<body>
<div id="app"></div>

<nav class="tagbar">
  <span class="k">决策地图</span>
  <span class="h">悬停任意节点看它的依赖链 · 点开看要点</span>
</nav>

<script>
/* ==== MAP_DATA_BEGIN ==== */
const MAP = {
  "name": "示例地图",
  "slug": "example",
  "updated": "2026-01-01",
  "brief": "第一波两张并行，定完接第三张。",
  "now": { "id": "01", "why": "两张里编号靠前的那张。" },
  "waveNotes": ["两张并行的起点。", "等第一张定完。"],
  "tickets": [
    { "id": "01", "short": "起点", "gist": "这张要先定什么。",
      "type": "grilling", "status": "待办", "blockedBy": [], "file": "tickets/01-example.md",
      "points": ["要定的一", "要定的二", "要定的三"] },
    { "id": "02", "short": "后继", "gist": "等第一张定完才动。",
      "type": "research", "status": "待办", "blockedBy": ["01"], "file": "tickets/02-example.md",
      "points": ["要定的一", "要定的二", "要定的三"] }
  ]
};
/* ==== MAP_DATA_END ==== */

// ── 以下为固定渲染器：不要按地图改 ──────────────────────────
const T = MAP.tickets;
const byId = {};
T.forEach(t => { byId[t.id] = t; });

const TYPENAME = { grilling: '拷问', research: '调研', task: '任务', prototype: '原型' };
const TYPECLS = { grilling: 'grill', research: 'res', task: 'task', prototype: 'proto' };
const SLABEL = { ready: '可开工', claimed: '进行中', blocked: '被阻塞', resolved: '已定' };
const WAVE_T = ['第一波', '第二波', '第三波', '第四波', '第五波', '第六波'];

function isResolved(id) { return !!byId[id] && byId[id].status === '已解决'; }
function stateOf(t) {
  if (t.status === '已解决') return 'resolved';
  if (t.status === '已关闭') return 'resolved';
  if (t.status === '已认领') return 'claimed';
  return t.blockedBy.every(isResolved) ? 'ready' : 'blocked';
}
function depth(t) {
  if (!t.blockedBy.length) return 0;
  return 1 + Math.max.apply(null, t.blockedBy.map(id => depth(byId[id])));
}
function waves() {
  const out = [];
  T.forEach(t => { const d = depth(t); (out[d] = out[d] || []).push(t); });
  return out.map(arr => arr.sort((a, b) => {
    const rank = { claimed: 0, ready: 1, blocked: 2, resolved: 3 };
    return rank[stateOf(a)] - rank[stateOf(b)] || a.id.localeCompare(b.id);
  }));
}
function readyList() { return T.filter(t => stateOf(t) === 'ready').sort((a, b) => a.id.localeCompare(b.id)); }
function waitList(t) { return t.blockedBy.filter(id => !isResolved(id)); }
function unlocksAfter(id) {
  return T.filter(x => x.blockedBy.indexOf(id) !== -1 && x.blockedBy.every(b => b === id || isResolved(b)));
}
function typeTag(t) { return '<span class="type ' + (TYPECLS[t.type] || 'grill') + '">' + (TYPENAME[t.type] || t.type) + '节点</span>'; }
function esc(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

// ── 节点 ────────────────────────────────────────────────────
function card(t) {
  const s = stateOf(t);
  const w = waitList(t);
  const un = unlocksAfter(t.id);
  const ptsLabel = s === 'resolved' ? '结论' : '要定的';
  return '<article class="tk s-' + s + '" data-tk="' + t.id + '">' +
    '<button class="tk-top" data-toggle="' + t.id + '">' +
      typeTag(t) +
      '<span class="tk-id">' + t.id + '</span>' +
      '<span class="tk-right"><span class="dot"></span><span class="state">' + SLABEL[s] + '</span>' +
        '<span class="tk-chev">⌄</span></span>' +
    '</button>' +
    '<span class="tk-nm">' + esc(t.short) + '</span>' +
    '<span class="tk-gist">' + esc(t.gist) + '</span>' +
    (w.length ? '<span class="tk-wait">等 ' + w.join(' · ') + '</span>' : '') +
    '<div class="det"><div class="det-in">' +
      '<div class="det-sec">' +
        '<div class="det-k">' + ptsLabel + '</div>' +
        '<ul class="bul">' + t.points.map(b => '<li>' + esc(b) + '</li>').join('') + '</ul>' +
      '</div>' +
      '<div class="det-sec dep-row">' +
        '<span class="dep"><span class="det-k" style="margin:0">前置</span>' +
          (w.length ? '<b>' + w.join('、') + '</b>' : '<span class="dep-none">无</span>') + '</span>' +
        '<span class="dep"><span class="det-k" style="margin:0">解锁</span>' +
          (un.length ? '<b>' + un.map(x => x.id).join('、') + '</b>' : '<span class="dep-none">不直接解锁别的</span>') + '</span>' +
      '</div>' +
      '<div class="det-file">docs/workflow/maps/' + MAP.slug + '/' + t.file + '</div>' +
    '</div></div>' +
  '</article>';
}

// ── 页面 ────────────────────────────────────────────────────
function render() {
  const ws = waves();
  const nowT = byId[MAP.now.id];
  const nowState = stateOf(nowT);
  const others = readyList().filter(x => x.id !== nowT.id);
  const running = T.filter(t => stateOf(t) === 'claimed' && t.id !== nowT.id);

  return '<div class="vA">' +
    '<header class="head">' +
      '<p class="eyebrow">' + MAP.slug + ' · ' + MAP.updated + '</p>' +
      '<h1>' + esc(MAP.name) + '</h1>' +
      '<p class="lede">' + esc(MAP.brief) + '</p>' +
    '</header>' +

    '<section class="now s-' + nowState + '">' +
      '<div class="now-k smallcaps">' + (nowState === 'claimed' ? '进行中' : '现在') + '</div>' +
      '<div>' +
        '<h2><span class="id">' + nowT.id + '</span>' + typeTag(nowT) + esc(nowT.short) + '</h2>' +
        '<p>' + esc(MAP.now.why) + '</p>' +
        (others.length || running.length ? '<p class="alt">' +
          (others.length ? '同批可开工 ' + others.map(x => x.id).join(' · ') : '') +
          (others.length && running.length ? '　｜　' : '') +
          (running.length ? '<b>另有进行中 ' + running.map(x => x.id + ' ' + x.short).join(' · ') + '</b>' : '') +
        '</p>' : '') +
      '</div>' +
    '</section>' +

    '<div class="waves" id="waves">' +
      ws.map((arr, i) => '<section class="wave">' +
        '<div class="wave-n">' + String(i + 1).padStart(2, '0') + '<small>' + arr.length + ' 张</small></div>' +
        '<div>' +
          '<div class="wave-head"><span class="t">' + (WAVE_T[i] || ('第 ' + (i + 1) + ' 波')) + '</span>' +
            '<span class="note">' + esc(MAP.waveNotes[i] || '') + '</span></div>' +
          '<div class="rail">' + arr.map(card).join('') + '</div>' +
        '</div>' +
      '</section>').join('') +
      '<svg class="edges" id="edges">' +
        '<defs>' +
          '<marker id="ah" viewBox="0 0 7 7" refX="6.2" refY="3.5" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto">' +
            '<path d="M0.6,0.8 L6.2,3.5 L0.6,6.2 z" fill="#bdb5a6"/></marker>' +
          '<marker id="ah-hi" viewBox="0 0 7 7" refX="6.2" refY="3.5" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto">' +
            '<path d="M0.6,0.8 L6.2,3.5 L0.6,6.2 z" fill="#0f6b52"/></marker>' +
        '</defs>' +
      '</svg>' +
    '</div>' +

    '<div class="legend">' +
      '<span><svg viewBox="0 0 26 12">' +
        '<path d="M6,1 L6,6 L20,6" fill="none" stroke="#bdb5a6" stroke-width="1.4"/>' +
        '<path d="M20,6 L20,11" fill="none" stroke="#bdb5a6" stroke-width="1.4"/>' +
        '<path d="M17.8,9.2 L20,11.4 L22.2,9.2" fill="none" stroke="#bdb5a6" stroke-width="1.4"/></svg>' +
        '前置 → 后继：源卡底边出发，落到被解锁那张的顶边</span>' +
      '<span><span class="dot" style="background:#0f6b52;width:6px;height:6px"></span>悬停节点，整条链高亮</span>' +
      '<span>' + typeTag({ type: 'grilling' }) + '对话定夺</span>' +
      '<span>' + typeTag({ type: 'research' }) + '查事实</span>' +
      '<span>' + typeTag({ type: 'task' }) + '先干活才能定</span>' +
      '<span>' + typeTag({ type: 'prototype' }) + '做个东西给人看</span>' +
    '</div>' +
  '</div>';
}

// ── 连线：电路式折线 ────────────────────────────────────────
function drawEdges() {
  const host = document.getElementById('waves');
  const svg = document.getElementById('edges');
  if (!host || !svg) return;
  const defs = svg.querySelector('defs').outerHTML;
  const r = host.getBoundingClientRect();
  svg.setAttribute('viewBox', '0 0 ' + r.width + ' ' + r.height);

  const edges = [];
  T.forEach(t => t.blockedBy.forEach(dep => { if (byId[dep]) edges.push({ dep: dep, to: t.id }); }));

  const srcTotal = {}, tgtTotal = {};
  edges.forEach(e => {
    srcTotal[e.dep] = (srcTotal[e.dep] || 0) + 1;
    tgtTotal[e.to] = (tgtTotal[e.to] || 0) + 1;
  });
  const srcSeen = {}, tgtSeen = {}, busCount = {};
  const parts = [];

  edges.forEach(e => {
    const a = host.querySelector('[data-tk="' + e.dep + '"]');
    const b = host.querySelector('[data-tk="' + e.to + '"]');
    if (!a || !b) return;
    const ar = a.getBoundingClientRect();
    const br = b.getBoundingClientRect();

    // 同一源卡的多条边沿底边错开；同一目标卡的多条边沿顶边错开
    const si = srcSeen[e.dep] || 0; srcSeen[e.dep] = si + 1;
    const ti = tgtSeen[e.to] || 0; tgtSeen[e.to] = ti + 1;
    const cx1 = ar.left - r.left + ar.width / 2 + (si - (srcTotal[e.dep] - 1) / 2) * 26;
    const cx2 = br.left - r.left + br.width / 2 + (ti - (tgtTotal[e.to] - 1) / 2) * 20;
    const x1 = Math.round(Math.max(ar.left - r.left + 8, Math.min(ar.right - r.left - 8, cx1)));
    const x2 = Math.round(Math.max(br.left - r.left + 8, Math.min(br.right - r.left - 8, cx2)));
    const y1 = Math.round(ar.bottom - r.top);
    const y2 = Math.round(br.top - r.top);

    // 总线走源卡下方的留白（波次的 padding-bottom），每条再错开几像素
    const wIdx = depth(byId[e.dep]);
    const bi = busCount[wIdx] || 0; busCount[wIdx] = bi + 1;
    const busY = Math.round(y1 + 13 + bi * 6);

    const rad = Math.min(6, Math.abs(x2 - x1) / 2);
    const dir = x2 > x1 ? 1 : -1;

    let d;
    if (Math.abs(x2 - x1) < 2) {
      d = 'M' + x1 + ',' + y1 + ' L' + x2 + ',' + (y2 - 1);
    } else {
      d = 'M' + x1 + ',' + y1 +
          ' L' + x1 + ',' + (busY - rad) +
          ' Q' + x1 + ',' + busY + ' ' + (x1 + dir * rad) + ',' + busY +
          ' L' + (x2 - dir * rad) + ',' + busY +
          ' Q' + x2 + ',' + busY + ' ' + x2 + ',' + (busY + rad) +
          ' L' + x2 + ',' + (y2 - 1);
    }

    parts.push('<path class="wire" data-from="' + e.dep + '" data-to="' + e.to + '" d="' + d + '" marker-end="url(#ah)"/>');
    parts.push('<circle class="node-dot" data-from="' + e.dep + '" data-to="' + e.to + '" cx="' + x1 + '" cy="' + y1 + '" r="2.2"/>');
  });

  svg.innerHTML = defs + parts.join('');
  applyHi();
}

// ── 展开与高亮 ──────────────────────────────────────────────
let openId = null;
let hoverId = null;

function traceSet(id) {
  const s = new Set();
  if (!id) return s;
  s.add(id);
  const up = x => byId[x].blockedBy.forEach(d => { if (!s.has(d)) { s.add(d); up(d); } });
  const down = x => T.forEach(y => { if (y.blockedBy.indexOf(x) !== -1 && !s.has(y.id)) { s.add(y.id); down(y.id); } });
  up(id); down(id);
  return s;
}

function applyHi() {
  const focus = hoverId || openId;
  const trace = traceSet(focus);
  document.querySelectorAll('[data-tk]').forEach(el => {
    const id = el.getAttribute('data-tk');
    el.classList.toggle('dim', !!focus && !trace.has(id));
    el.classList.toggle('hot', !!focus && trace.has(id));
  });
  const svg = document.getElementById('edges');
  if (!svg) return;
  svg.classList.toggle('focus', !!focus);
  const edgeHot = (dep, to) => !!focus && trace.has(dep) && trace.has(to);
  svg.querySelectorAll('.wire').forEach(p => {
    const hot = edgeHot(p.getAttribute('data-from'), p.getAttribute('data-to'));
    p.classList.toggle('hi', hot);
    p.setAttribute('marker-end', hot ? 'url(#ah-hi)' : 'url(#ah)');
  });
  svg.querySelectorAll('.node-dot').forEach(c => {
    c.classList.toggle('hi', edgeHot(c.getAttribute('data-from'), c.getAttribute('data-to')));
  });
}

function collapse() {
  document.querySelectorAll('[data-tk]').forEach(x => x.classList.remove('exp'));
  openId = null; applyHi(); setTimeout(drawEdges, 250);
}

function toggleCard(id) {
  const el = document.querySelector('[data-tk="' + id + '"]');
  if (!el) return;
  const willOpen = openId !== id;
  document.querySelectorAll('[data-tk]').forEach(x => x.classList.remove('exp'));
  if (willOpen) el.classList.add('exp');
  openId = willOpen ? id : null;
  applyHi();
  setTimeout(drawEdges, 250);
}

// ── 启动 ────────────────────────────────────────────────────
const app = document.getElementById('app');
app.innerHTML = render();
document.title = '决策地图 · ' + MAP.name;
document.querySelector('.tagbar .k').textContent = MAP.slug;
requestAnimationFrame(drawEdges);

document.addEventListener('click', e => {
  const t = e.target.closest('[data-toggle]');
  if (t) { toggleCard(t.getAttribute('data-toggle')); return; }
  if (!e.target.closest('.tagbar') && openId) collapse();
});

document.addEventListener('mouseover', e => {
  const tk = e.target.closest('[data-tk]');
  const id = tk ? tk.getAttribute('data-tk') : null;
  if (id !== hoverId) { hoverId = id; applyHi(); }
});
document.addEventListener('mouseout', e => {
  const tk = e.target.closest('[data-tk]');
  if (!tk) return;
  if (e.relatedTarget && tk.contains(e.relatedTarget)) return;
  if (hoverId === tk.getAttribute('data-tk')) { hoverId = null; applyHi(); }
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && openId) collapse();
});

let rp = false;
window.addEventListener('resize', () => {
  if (rp) return;
  rp = true;
  requestAnimationFrame(() => { rp = false; drawEdges(); });
});
</script>
